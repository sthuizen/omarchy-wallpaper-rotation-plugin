name: Check Wallpaper Rotation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Bash syntax and manifest JSON
        run: |
          bash -n WallpaperRotation.sh tests/test-control.sh
          jq -e . manifest.json > /dev/null
      - name: Exercise isolated controller and systemd unit checks
        run: ./tests/test-control.sh
